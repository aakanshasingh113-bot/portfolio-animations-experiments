<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magnetic Button</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="stage">
    <!--
      The button is built from three layers stacked on top of each other:
        1. .btn-shape  – the black pill you see (this is what stretches)
        2. .btn-label  – the "Get started" text
        3. .btn-done   – the checkmark + "Done" (hidden until clicked)
      Keeping them separate lets us animate each one independently.
    -->
    <button class="btn" id="btn" type="button" aria-pressed="false">
      <span class="btn-shape" aria-hidden="true"></span>

      <span class="btn-label">Get started</span>

      <span class="btn-done" aria-hidden="true">
        <svg class="check" viewBox="0 0 24 24" width="40" height="40">
          <path d="M5 12.5 L10 17.5 L19 7.5" />
        </svg>
        <span class="done-text">Done</span>
      </span>
    </button>

    <!-- Screen readers hear this when the state changes -->
    <span class="sr-only" id="status" aria-live="polite"></span>
  </main>

  <p class="hint">Move your cursor near the button &middot; click to complete &middot; click again to undo</p>

  <script src="script.js"></script>
</body>
</html>
