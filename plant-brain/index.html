<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Plant Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2d3a36; --soft: #5d6d67; --energy: #f3bf5b; --water: #74bfe6; --health: #ef95a0; --leaf: #6fae68;
    --head: "Fraunces", Georgia, serif; --ui: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #cfe6f0; font-family: var(--ui); color: var(--ink); -webkit-text-size-adjust: 100%; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; border: 0; }
  button:focus-visible { outline: 3px solid #4f8f6a; outline-offset: 3px; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .glass {
    background: rgba(255, 255, 255, .6); border: 1px solid rgba(255, 255, 255, .7); border-radius: 20px;
    -webkit-backdrop-filter: blur(14px) saturate(1.25); backdrop-filter: blur(14px) saturate(1.25);
    box-shadow: 0 8px 28px rgba(40, 60, 70, .16);
  }
  .hidden, .hidden * { pointer-events: none !important; }
  .hidden { opacity: 0 !important; visibility: hidden; transition: opacity .9s, visibility 0s .9s !important; }

  /* ---------- HUD ---------- */
  #meters { position: fixed; z-index: 5; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); padding: 12px 14px; width: min(210px, 46vw); transition: opacity .6s; }
  .m { display: flex; align-items: center; gap: 9px; position: relative; }
  .m + .m { margin-top: 9px; }
  .m svg { flex: 0 0 20px; width: 20px; height: 20px; }
  .bar { flex: 1; height: 10px; border-radius: 6px; background: rgba(45, 58, 54, .13); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; border-radius: 6px; transform-origin: left center; transition: transform .35s ease-out; }
  #mE { background: linear-gradient(90deg, #f7d58a, var(--energy)); } #mW { background: linear-gradient(90deg, #a7daf2, var(--water)); } #mH { background: linear-gradient(90deg, #f7bcc3, var(--health)); }
  .m.low .bar { animation: low 1.1s ease-in-out infinite; }
  @keyframes low { 50% { background: rgba(239, 149, 160, .5); } }
  [data-tip]::after {
    content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 8px); z-index: 9; white-space: nowrap; pointer-events: none;
    font: 700 12px var(--ui); color: #fff; background: rgba(45, 58, 54, .86); padding: 5px 10px; border-radius: 10px; opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s;
  }
  [data-tip]:hover::after { opacity: 1; transform: none; }
  #info { position: fixed; z-index: 5; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 12px; transition: opacity .6s; }
  #info .day { font: 600 21px/1 var(--head); }
  #info .sub { font: 700 12px/1.3 var(--ui); color: var(--soft); }
  .round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .7); box-shadow: 0 2px 8px rgba(40, 60, 70, .15); }
  .round svg { width: 20px; height: 20px; }
  #toast { position: fixed; z-index: 6; left: 50%; top: max(84px, calc(env(safe-area-inset-top) + 84px)); transform: translate(-50%, -8px); padding: 9px 18px; font: 400 italic 18px var(--head); white-space: nowrap; opacity: 0; transition: opacity .7s, transform .7s; pointer-events: none; max-width: 94vw; overflow: hidden; text-overflow: ellipsis; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #tutor { position: fixed; z-index: 6; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 12px 14px 12px 20px; display: flex; align-items: center; gap: 14px; font: 700 16px/1.3 var(--ui); max-width: min(94vw, 520px); transition: opacity .6s; }
  #tutor button { flex: 0 0 auto; font: 700 13px var(--ui); color: var(--soft); background: rgba(255, 255, 255, .7); border-radius: 12px; padding: 6px 12px; }
  #tip { position: fixed; z-index: 7; left: 0; top: 0; padding: 6px 11px; font: 800 13px var(--ui); display: flex; align-items: center; gap: 5px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s; border-radius: 14px; }
  #tip.on { opacity: 1; } #tip.bad { color: #b4525d; }
  #tip svg { width: 14px; height: 14px; } #tip span { margin-right: 6px; }

  /* ---------- Radial menu ---------- */
  #radial { position: fixed; z-index: 8; left: 0; top: 0; width: 0; height: 0; }
  #radial button {
    position: absolute; width: 58px; height: 58px; margin: -29px; border-radius: 50%; display: grid; place-items: center; padding: 0;
    background: rgba(255, 255, 255, .78); border: 1px solid rgba(255, 255, 255, .9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 6px 18px rgba(40, 60, 70, .22); transform: scale(.2); opacity: 0; transition: transform .28s cubic-bezier(.3, 1.5, .5, 1), opacity .2s;
  }
  #radial.on button { transform: scale(1); opacity: 1; }
  #radial button svg { width: 26px; height: 26px; }
  #radial button b { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 4px; font: 800 11px var(--ui); white-space: nowrap; color: #fff; background: rgba(45, 58, 54, .8); padding: 2px 8px; border-radius: 9px; }
  #radial button:disabled { filter: grayscale(.9); opacity: .55 !important; cursor: default; }

  /* ---------- Title + summary ---------- */
  #title { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; padding: max(9vh, 40px) 20px 20px; text-align: center; transition: opacity 1.2s; pointer-events: none; }
  #title h1 { font: 600 clamp(46px, 11vw, 96px)/.95 var(--head); margin: 0; letter-spacing: -.02em; color: #3d5a4a; text-shadow: 0 2px 0 rgba(255, 255, 255, .5); }
  #title h1 i { font-weight: 400; color: #6b8f6f; }
  #title p { font: 400 italic clamp(16px, 2.6vw, 21px)/1.35 var(--head); color: #56706a; margin: 12px 0 0; max-width: 460px; }
  #title .best { font: 700 13px var(--ui); color: #5d6d67; margin-top: 10px; letter-spacing: .03em; }
  .btn { font: 800 19px var(--ui); color: #fff; background: linear-gradient(180deg, #86bf83, #5f9f69); border-radius: 30px; padding: 13px 38px; box-shadow: 0 5px 0 #4a8256, 0 14px 26px rgba(60, 110, 80, .3); transition: transform .15s, box-shadow .15s; }
  .btn:hover { transform: translateY(-2px); } .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4a8256; }
  #title .btn { pointer-events: auto; margin-top: auto; margin-bottom: max(8vh, 28px); }
  #summary { position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(40, 54, 60, .28); opacity: 0; pointer-events: none; transition: opacity .9s; overflow-y: auto; }
  #summary:not(.on) * { pointer-events: none; }
  #summary.on { opacity: 1; pointer-events: auto; }
  .card { width: min(100%, 420px); margin: auto; padding: 22px 24px 24px; text-align: center; background: rgba(255, 255, 255, .82); }
  .card h2 { font: 600 clamp(28px, 6vw, 36px)/1.05 var(--head); margin: 0 0 4px; color: #3d5a4a; }
  .card p { font: 400 italic 16px/1.4 var(--head); color: var(--soft); margin: 0 0 12px; }
  #sketch { width: 100%; max-width: 250px; height: auto; border-radius: 14px; background: #f8f3e6; box-shadow: inset 0 0 0 1px rgba(90, 80, 60, .16); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 10px; }
  .stats div { background: rgba(255, 255, 255, .7); border-radius: 14px; padding: 8px 4px; }
  .stats b { display: block; font: 600 24px/1.1 var(--head); color: #3d5a4a; }
  .stats span { font: 700 11px var(--ui); color: var(--soft); text-transform: uppercase; letter-spacing: .06em; }
  .score { font: 800 15px var(--ui); margin: 4px 0 16px; color: var(--ink); }
  .score small { display: block; font: 700 12px var(--ui); color: var(--soft); margin-top: 2px; }
  @media (max-width: 560px) {
    #meters { padding: 9px 11px; width: 150px; } .m svg { flex-basis: 17px; width: 17px; height: 17px; } .m + .m { margin-top: 7px; }
    #info { padding: 7px 8px 7px 12px; gap: 8px; } #info .day { font-size: 18px; }
    #toast { font-size: 16px; top: max(108px, calc(env(safe-area-inset-top) + 108px)); } #tutor { font-size: 15px; }
  }
  @media (max-height: 460px) { #title { padding-top: 14px; } #title h1 { font-size: 44px; } #title p { display: none; } .card { padding: 12px 18px 14px; } #sketch { max-width: 130px; } .stats { margin: 6px 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="meters" class="glass hidden">
  <div class="m" id="rowE" data-tip="Energy, from leaves in sunlight"><span id="icE"></span><div class="bar"><i id="mE"></i></div></div>
  <div class="m" id="rowW" data-tip="Water, drunk by roots"><span id="icW"></span><div class="bar"><i id="mW"></i></div></div>
  <div class="m" id="rowH" data-tip="Health. Keep energy and water up"><span id="icH"></span><div class="bar"><i id="mH"></i></div></div>
</div>
<div id="info" class="glass hidden">
  <div><div class="day" id="dayLbl">Day 1</div><div class="sub" id="subLbl">Dawn</div></div>
  <button class="round" id="muteBtn" aria-label="Mute sound"></button>
</div>
<div id="toast" class="glass"></div>
<div id="tutor" class="glass hidden"><span id="tutTxt"></span><button id="tutSkip">Skip</button></div>
<div id="tip" class="glass"></div>
<div id="radial"></div>

<div id="title">
  <h1>Plant <i>Brain</i></h1>
  <p>One seed. One day at a time. Find water, follow the light, and bloom.</p>
  <div class="best" id="bestLine"></div>
  <button class="btn" id="plantBtn">Plant</button>
</div>

<div id="summary"><div class="card glass">
  <h2 id="sumTitle"></h2><p id="sumMsg"></p>
  <canvas id="sketch" width="500" height="400"></canvas>
  <div class="stats">
    <div><b id="stDays">0</b><span>Days</span></div><div><b id="stHeight">0</b><span>Height</span></div><div><b id="stSeeds">0</b><span>Seeds</span></div>
  </div>
  <div class="score" id="sumScore"></div>
  <button class="btn" id="againBtn">Plant again</button>
</div></div>

<script>
'use strict';
/* =====================================================================
   1. CONSTANTS + TUNING
   ===================================================================== */
const DAY_LEN = 90;            // seconds for one full day + night
const DAY_FRAC = 0.62;         // share of the cycle that is daylight
const START_PHASE = 0.04;
const WORLD_X = 560, SOIL_BOTTOM = 620, SKY_LIMIT = -1100;
const SOIL_W = 2000, SOIL_H = 700, FOG_SCALE = 0.25;
const SEG_N = 12;              // samples per stem/root curve
const MAX_STEM = 120, MAX_ROOT = 130, MIN_LEN = 16, PICK_PX = 26;
const COST = { rootE: .05, rootW: .02, stemE: .10, stemW: .06, leafE: 8, leafW: 5, thornE: 5, thornW: 2, flowerE: 55, flowerW: 35, flick: 2 };
const START = { energy: 42, water: 42, health: 100 };
const LEAF_RATE = 1.0;         // energy per second for a fully lit, healthy leaf
const LEAF_LEN = 38, LEAF_W = 13;
const UPKEEP = { base: .11, perSeg: .0035, perLeaf: .012, night: 1.5, ramp: .1 };  // energy per second
const THIRST = { base: .09, leafDay: .03, leafNight: .012, dry: 1.5 };              // water per second
const DRINK_RATE = 1.3, TRICKLE = .0012, NUTRIENT_BONUS = 22;
const HEALTH = { starve: 1.5, parch: 1.5, regen: .5, frost: .35 };
const FLOWER_DAY = 6;          // "after day 5"
const THORN_CHARGES = 3;
const CAT_SPEED = 15, BEETLE_SPEED = 11, CAT_BITE = .11, BEETLE_BITE = .065;
const FROST_BITE = .028, WIND_BASE = 3, WIND_GUST = 17;
const TAU = Math.PI * 2;
const SKY = [ // [phase, top colour, horizon colour]
  [0.00, '#9db4e0', '#ffd6c0'], [0.08, '#8fc4ee', '#fdeeda'], [0.30, '#7dbfee', '#dcf1f6'], [0.45, '#8ab5e6', '#ffe3ad'],
  [0.56, '#8985c8', '#ffb48c'], [0.64, '#4b4b8e', '#d88ba1'], [0.72, '#151b3f', '#2e3766'], [0.93, '#151b3f', '#2e3766'], [1.00, '#9db4e0', '#ffd6c0']
];
const TUTORIAL = ['Drag down from the seed to grow a root', 'Drag up from the sprout to grow a stem', 'Tap the tip of a stem to grow a leaf',
  'Leaves gather sunlight. Roots drink from hidden water. Tap a stem for thorns and, after day 5, a flower.'];

/* =====================================================================
   2. UTILITIES + STORAGE
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const buzz = ms => { try { if (navigator.vibrate && !store.muted) navigator.vibrate(ms); } catch (e) { /* no haptics */ } };
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function mulberry(seed) { return () => { let t = seed += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const STORE_KEY = 'plantbrain.v1';
const store = { best: 0, longest: 0, muted: false, tutDone: false };
try { Object.assign(store, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) { /* storage unavailable */ }
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* storage unavailable */ } }

const ICON = {
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#f3bf5b"/><g stroke="#f3bf5b" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></g></svg>',
  drop: '<svg viewBox="0 0 24 24"><path d="M12 2.5c4 5 6.5 8.300 6.500 11.800a6.500 6.500 0 0 1-13 0C5.500 10.800 8 7.500 12 2.500z" fill="#74bfe6"/><path d="M9 14.500a3.200 3.200 0 0 0 2.600 3.200" stroke="#fff" stroke-width="1.600" fill="none" stroke-linecap="round"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M12 20.500s-7.500-4.600-7.500-10.200A4.300 4.300 0 0 1 12 7.600a4.300 4.300 0 0 1 7.500 2.700c0 5.600-7.500 10.200-7.500 10.200z" fill="#ef95a0"/></svg>',
  leaf: '<svg viewBox="0 0 24 24"><path d="M4 20C4 9 10 4 20 4c0 10-5 16-16 16z" fill="#6fae68"/><path d="M4 20L15 9" stroke="#3f7a45" stroke-width="1.600" stroke-linecap="round"/></svg>',
  thorn: '<svg viewBox="0 0 24 24"><path d="M12 3v18" stroke="#6b8f5a" stroke-width="3" stroke-linecap="round"/><path d="M12 7l6-3-3 6zM12 13l-6-3 3 6zM12 18l5-2-2 5z" fill="#b0705a"/></svg>',
  flower: '<svg viewBox="0 0 24 24"><g fill="#f4a9bd"><circle cx="12" cy="6" r="4"/><circle cx="17.700" cy="10.100" r="4"/><circle cx="15.500" cy="16.900" r="4"/><circle cx="8.500" cy="16.900" r="4"/><circle cx="6.300" cy="10.100" r="4"/></g><circle cx="12" cy="12" r="3.400" fill="#f3bf5b"/></svg>',
  sound: '<svg viewBox="0 0 24 24"><path d="M4 9.500v5h3.500L12 18.500v-13L7.500 9.500z" fill="#5d6d67"/><path d="M15 9a4.200 4.200 0 0 1 0 6M17.500 6.500a7.800 7.800 0 0 1 0 11" stroke="#5d6d67" stroke-width="1.800" fill="none" stroke-linecap="round"/></svg>',
  mute: '<svg viewBox="0 0 24 24"><path d="M4 9.500v5h3.500L12 18.500v-13L7.500 9.500z" fill="#5d6d67"/><path d="M15.500 9.500l5 5M20.500 9.500l-5 5" stroke="#5d6d67" stroke-width="1.800" stroke-linecap="round"/></svg>'
};

/* =====================================================================
   3. AUDIO  (all synthesised with the Web Audio API)
   ===================================================================== */
const Sound = (() => {
  let ac = null, master, padBus, padFilter, noiseBuf, windG, windF, rainG, nextChord = 0, nextBell = 0, nextCricket = 0, chordIdx = 0;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const DAY_CHORDS = [[48, 55, 64, 71, 74], [45, 52, 60, 67, 71], [41, 48, 57, 64, 67], [43, 50, 59, 62, 69]];
  const NIGHT_CHORDS = [[45, 52, 60, 67], [41, 48, 57, 64], [38, 45, 53, 60], [40, 47, 55, 62]];
  const PENTA = [72, 74, 76, 79, 81, 84];
  const ok = () => ac && !store.muted;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = store.muted ? 0 : .9; master.connect(ac.destination);
      padFilter = ac.createBiquadFilter(); padFilter.type = 'lowpass'; padFilter.frequency.value = 900;
      padBus = ac.createGain(); padBus.gain.value = .5; padFilter.connect(padBus).connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const wn = noise(); windF = ac.createBiquadFilter(); windF.type = 'lowpass'; windF.frequency.value = 300; windG = ac.createGain(); windG.gain.value = 0; wn.connect(windF).connect(windG).connect(master); wn.start();
      const rn = noise(), rf = ac.createBiquadFilter(); rf.type = 'bandpass'; rf.frequency.value = 2600; rf.Q.value = .4; rainG = ac.createGain(); rainG.gain.value = 0; rn.connect(rf).connect(rainG).connect(master); rn.start();
      nextChord = ac.currentTime + .2; nextBell = ac.currentTime + 4;
    } catch (e) { ac = null; }
  }
  function noise() { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }
  function env(t, a, peak, d, dest = master) { const g = ac.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak, .0002), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); g.connect(dest); return g; }
  function tone(type, f0, f1, t, a, d, vol, dest) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + a + d); o.connect(env(t, a, vol, d, dest)); o.start(t); o.stop(t + a + d + .05); }
  function hiss(type, freq, q, t, a, d, vol) { const n = noise(), f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; n.connect(f).connect(env(t, a, vol, d)); n.start(t); n.stop(t + a + d + .05); return f; }
  function chord(notes, t, dur, vol) {
    for (const m of notes) for (const [type, det, v] of [['sine', 0, 1], ['triangle', 5, .45]]) {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = hz(m); o.detune.value = det + rand(-4, 4);
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol * v, t + 3); g.gain.setValueAtTime(vol * v, t + dur - 3.5); g.gain.linearRampToValueAtTime(.0001, t + dur + 1.5);
      o.connect(g).connect(padFilter); o.start(t); o.stop(t + dur + 1.6);
    }
  }
  return {
    init,
    setMuted(m) { store.muted = m; saveStore(); if (ac) master.gain.setTargetAtTime(m ? 0 : .9, ac.currentTime, .05); },
    tick(night, wind, rain) { // called every frame: generative pad, bells, crickets and weather beds
      if (!ac) return; const t = ac.currentTime;
      padFilter.frequency.setTargetAtTime(lerp(950, 480, night), t, 1.5);
      windG.gain.setTargetAtTime(.012 + wind * .11, t, .6); windF.frequency.setTargetAtTime(260 + wind * 500 + Math.sin(t * .7) * 90, t, .4);
      rainG.gain.setTargetAtTime(rain * .075, t, .5);
      if (t > nextChord) { const set = night > .5 ? NIGHT_CHORDS : DAY_CHORDS; chord(set[chordIdx++ % 4], t, 9, night > .5 ? .028 : .034); nextChord = t + 8; }
      if (t > nextBell) { if (ok()) { const m = pick(PENTA) - (night > .5 ? 12 : 0); tone('sine', hz(m), 0, t, .01, 1.8, night > .5 ? .018 : .026); if (Math.random() < .4) tone('sine', hz(m + pick([3, 4, 7])), 0, t + .35, .01, 1.6, .016); } nextBell = t + rand(2.5, 6) * (night > .5 ? 1.8 : 1); }

  if (bfly.on) { c.save(); c.translate(bfly.x, bfly.y); c.rotate(Math.sin(bfly.t * 3) * .2); const fl = Math.abs(Math.sin(bfly.t * 11)); c.fillStyle = bfly.col; for (const sd of [-1, 1]) { c.beginPath(); c.ellipse(sd * 6 * fl, -3, 7 * fl + 1, 6, sd * .5, 0, TAU); c.fill(); c.beginPath(); c.ellipse(sd * 4.5 * fl, 4, 5 * fl + 1, 4, -sd * .4, 0, TAU); c.fill(); } c.fillStyle = '#5a4a44'; c.fillRect(-.8, -6, 1.6, 12); c.restore(); }
}

function drawSketch() { // a small pencil drawing of the final plant for the summary card
  const el = $('sketch'), c = el.getContext('2d'), Wd = el.width, Hd = el.height;
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#f8f3e6'; c.fillRect(0, 0, Wd, Hd);
  let l = -60, r = 60, t = -60, b = 50; for (const s of G.segs) for (const q of s.pts) { l = Math.min(l, q.x); r = Math.max(r, q.x); t = Math.min(t, q.y); b = Math.max(b, q.y); }
  for (const lf of G.leaves) { l = Math.min(l, lf.tx); r = Math.max(r, lf.tx); t = Math.min(t, lf.ty); }
  const pad = 46, sc = Math.min((Wd - pad * 2) / (r - l), (Hd - pad * 2) / (b - t));
  c.translate(Wd / 2 - (l + r) / 2 * sc, Hd / 2 - (t + b) / 2 * sc); c.scale(sc, sc);
  const keep = [G.wilt, G.windAmp, G.gust]; G.wilt = G.state === 'wilt' || keep[0] > 0 ? .6 : 0; G.windAmp = 0; G.gust = 0;
  c.strokeStyle = 'rgba(90,80,60,.5)'; c.lineWidth = 1.2 / sc; c.setLineDash([6 / sc, 5 / sc]); c.beginPath(); c.moveTo(l - 40 / sc, 0); c.lineTo(r + 40 / sc, 0); c.stroke(); c.setLineDash([]);
  for (const s of G.segs) drawSeg(c, s, true); for (const lf of G.leaves) drawLeaf(c, lf, true); if (G.flower) drawFlower(c, G.flower, true);
  [G.wilt, G.windAmp, G.gust] = keep;
}

/* =====================================================================
   9. UI  (panels, radial menu, tutorial, title, endings)
   ===================================================================== */
function updateHud() {
  $('mE').style.transform = `scaleX(${G.energy / 100})`; $('mW').style.transform = `scaleX(${G.water / 100})`; $('mH').style.transform = `scaleX(${G.health / 100})`;
  $('rowE').classList.toggle('low', G.energy < 12); $('rowW').classList.toggle('low', G.water < 12); $('rowH').classList.toggle('low', G.health < 30);
  $('dayLbl').textContent = 'Day ' + G.day;
  const p = G.p, phase = p < .08 ? 'Dawn' : p < .26 ? 'Morning' : p < .4 ? 'Midday' : p < .52 ? 'Golden hour' : p < .66 ? 'Dusk' : 'Night';
  $('subLbl').textContent = phase + ' · ' + heightCm() + ' cm';
}
function setTut(n) {
  G.tut = n; G.tutT = 0; const el = $('tutor');
  if (n < 0 || n >= TUTORIAL.length) { G.tut = -1; el.classList.add('hidden'); if (!store.tutDone) { store.tutDone = true; saveStore(); } return; }
  $('tutTxt').textContent = TUTORIAL[n]; $('tutSkip').textContent = n === 3 ? 'Got it' : 'Skip'; el.classList.remove('hidden');
}
let radialSeg = null;
function closeRadial() { const el = $('radial'); if (!el.classList.contains('on')) return; el.classList.remove('on'); radialSeg = null; setTimeout(() => { if (!radialSeg) el.innerHTML = ''; }, 250); }
function openRadial(seg, sx, sy) {
  const el = $('radial'), items = [];
  if (!seg.leaf && seg.grown >= 1) items.push({ icon: ICON.leaf, label: `Leaf · ${COST.leafE}`, ok: canPay(COST.leafE, COST.leafW), tip: 'Grow a leaf at the end of this stem', run: () => addLeaf(seg) });
  items.push({ icon: ICON.thorn, label: seg.thorns ? 'Thorns ready' : `Thorns · ${COST.thornE}`, ok: !seg.thorns && canPay(COST.thornE, COST.thornW), tip: 'Thorns stop caterpillars climbing past', run: () => { pay(COST.thornE, COST.thornW); seg.thorns = THORN_CHARGES; Sound.grow(false); } });
  if (!seg.kids.length && !G.flower) { const early = G.day < FLOWER_DAY;
    items.push({ icon: ICON.flower, label: early ? 'After day 5' : `Flower · ${COST.flowerE}`, ok: !early && canPay(COST.flowerE, COST.flowerW), tip: 'Bloom, drop seeds and finish your story', run: () => startBloom(seg) }); }
  el.innerHTML = ''; el.style.transform = `translate(${clamp(sx, 76, view.cw - 76)}px, ${clamp(sy, 86, view.ch - 96)}px)`;
  items.forEach((it, i) => { const a = -Math.PI / 2 + (i - (items.length - 1) / 2) * 1.15, b = document.createElement('button');
    b.style.left = Math.cos(a) * 66 + 'px'; b.style.top = Math.sin(a) * 66 + 'px'; b.innerHTML = it.icon + '<b></b>'; b.querySelector('b').textContent = it.label; b.disabled = !it.ok; b.title = it.tip; b.setAttribute('aria-label', it.tip);
    b.addEventListener('click', () => { Sound.init(); it.run(); closeRadial(); }); el.appendChild(b); });
  radialSeg = seg; requestAnimationFrame(() => el.classList.add('on')); Sound.soft();
}

function refreshTitle() { $('bestLine').textContent = store.best ? `Best score ${store.best} · longest life ${store.longest} day${store.longest === 1 ? '' : 's'}` : ''; }
function startRun() {
  Sound.init(); segId = 0;
  Object.assign(G, { state: 'play', p: START_PHASE, day: 1, energy: START.energy, water: START.water, health: START.health, segs: [], leaves: [], cats: [], beetles: [], parts: [], events: [], rays: [],
    rain: 0, gust: 0, frost: 0, dry: false, moist: .5, drag: null, maxH: 0, flower: null, wilt: 0, bloomT: 0, endT: 0, seeds: 0, seedsOut: 0, leafSide: 1, lightT: 0, touchT: 0, catT: 24, beetleT: 30, sprout: 0, warned: {} });
  genWorld();
  G.stemBase = makeSeg('stem', null, 0, 0, 0, rand(-3, 3), -36, .06); G.rootBase = makeSeg('root', null, 0, 0, 0, rand(-3, 3), 28, -.08);   // the seed sprouts
  $('title').classList.add('hidden'); $('summary').classList.remove('on'); $('meters').classList.remove('hidden'); $('info').classList.remove('hidden');
  Sound.grow(false); setTut(store.tutDone ? -1 : 0);
  if (store.tutDone) toast('Day 1. Find water, follow the light.', 4);
}
function startBloom(seg) {
  pay(COST.flowerE, COST.flowerW); G.flower = { seg, open: 0 }; G.state = 'bloom'; G.bloomT = 0; G.drag = null; hideTip();
  G.seeds = 3 + G.leaves.filter(l => l.hp > 0).length + Math.floor(G.maxH / 50) + Math.floor(G.health / 34);
  Sound.bloom(); toast('Blooming…', 5);
}
function startWilt() { G.state = 'wilt'; G.endT = 0; G.drag = null; hideTip(); closeRadial(); Sound.wilt(); }
function showSummary(bloomed) {
  G.state = 'summary';
  const days = bloomed ? G.day : G.day - 1, cm = heightCm(), score = days * 100 + cm * 2 + G.seeds * 40;
  const newBest = score > store.best; if (newBest) store.best = score; if (days > store.longest) store.longest = days; saveStore();
  $('sumTitle').textContent = bloomed ? 'Seeds dropped' : 'Rest now, little plant';
  $('sumMsg').textContent = bloomed ? 'Your flower opened and the wind carried your seeds on. The story continues.' : (G.energy <= 0 ? 'The light ran out before the leaves could catch enough.' : G.water <= 0 ? 'The soil ran dry before the roots found more water.' : 'It was a hard season.') + ' The soil will remember, and another seed is waiting.';
  $('stDays').textContent = days; $('stHeight').textContent = cm + ' cm'; $('stSeeds').textContent = G.seeds;
  $('sumScore').innerHTML = `Score ${score}${newBest ? ' · a new best!' : ''}<small>Best ${store.best} · longest life ${store.longest} day${store.longest === 1 ? '' : 's'}</small>`;
  drawSketch(); $('summary').classList.add('on'); $('tutor').classList.add('hidden'); refreshTitle();
}
function updateEndings(dt) {
  if (G.state === 'bloom') {
    G.bloomT += dt; G.flower.open = Math.min(1, G.bloomT / 3.6);
    const q = G.flower.seg.pts[SEG_N];
    if (G.bloomT > 2.4 && G.seedsOut < G.seeds && Math.random() < dt * 4) { G.seedsOut++; G.parts.push({ kind: 'seed', x: q.x + rand(-6, 6), y: q.y - 6, vx: rand(10, 30), vy: 0, life: 0, max: 60, rot: rand(TAU) }); }
    if (G.bloomT > 1.5 && Math.random() < dt * 1.2) G.parts.push({ kind: 'petal', x: q.x + rand(-14, 14), y: q.y, vx: rand(-10, 30), vy: 0, life: 0, max: 5, rot: rand(TAU), vr: rand(-2, 2), size: .55, col: '#f7c3d2' });
    if (G.bloomT > 9.5) showSummary(true);
  } else if (G.state === 'wilt') { G.endT += dt; G.wilt = ease(G.endT / 4.2); if (G.endT > 5.2) showSummary(false); }
}

$('icE').innerHTML = ICON.sun; $('icW').innerHTML = ICON.drop; $('icH').innerHTML = ICON.heart;
function refreshMute() { $('muteBtn').innerHTML = store.muted ? ICON.mute : ICON.sound; $('muteBtn').setAttribute('aria-label', store.muted ? 'Unmute sound' : 'Mute sound'); }
$('muteBtn').addEventListener('click', () => { Sound.init(); Sound.setMuted(!store.muted); refreshMute(); });
$('plantBtn').addEventListener('click', startRun);
$('againBtn').addEventListener('click', startRun);
$('tutSkip').addEventListener('click', () => setTut(-1));
window.addEventListener('resize', resize);
window.addEventListener('keydown', e => { if (e.key === 'm' || e.key === 'M') $('muteBtn').click(); if (e.key === 'Escape') closeRadial(); });

/* =====================================================================
   10. MAIN LOOP + BOOT
   ===================================================================== */
let lastTs = 0;
function step(dt) { // one simulation step (also used to fast-forward in tests)
  G.t += dt; swayT += dt * (1 + G.gust * 1.6);
  if (G.state === 'play') { updateWorld(dt); G.sprout = Math.min(1, G.sprout + dt); if (G.tut === 3) { G.tutT += dt; if (G.tutT > 9) setTut(-1); } }
  else if (G.state === 'title') { G.dayT = G.p / DAY_FRAC; G.night = 0; G.sunI = Math.pow(Math.sin(Math.PI * G.dayT), .6); }
  else { G.gust = lerp(G.gust, 0, dt); G.rain = lerp(G.rain, 0, dt); G.frost = lerp(G.frost, 0, dt); G.windAmp = WIND_BASE + (G.state === 'bloom' ? 3 : 0); G.dayT = G.p < DAY_FRAC ? G.p / DAY_FRAC : -1; }
  if (G.state !== 'title') updatePlant(dt);
  updateEndings(dt);
}
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  step(dt);
  for (const m of motes) { m.x += m.vx * dt * (1 + G.gust * 4); m.y += m.vy * dt; if (m.x > 1.03) m.x = -.03; if (m.y < -.03) m.y = 1; }
  bfly.next -= dt; // a butterfly drifts past now and then
  if (!bfly.on && bfly.next <= 0 && G.sunI > .3 && G.rain < .2) { bfly.on = true; bfly.t = 0; bfly.x = -30; bfly.y = view.ch * rand(.2, .45); bfly.col = pick(['#f4a9bd', '#f6d36b', '#a9c8f4', '#fff']); }
  if (bfly.on) { bfly.t += dt; bfly.x += (46 + Math.sin(bfly.t * 1.3) * 22) * dt; bfly.y += Math.sin(bfly.t * 2.1) * 34 * dt; if (bfly.x > view.cw + 40) { bfly.on = false; bfly.next = rand(18, 40); } }
  updateCamera(dt);
  render();
  if (G.state !== 'title') updateHud();
  Sound.tick(G.night, clamp(G.gust + (G.windAmp - WIND_BASE) / 30, 0, 1), G.rain);
}
resize(); buildSoil(); genWorld(); refreshTitle(); refreshMute(); updateCamera(0, true);
requestAnimationFrame(frame);
</script>
